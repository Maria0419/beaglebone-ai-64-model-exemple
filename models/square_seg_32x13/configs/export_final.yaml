# Final ONNX export preset for the selected square-segmentation model.
# `train_config` loads shared fields such as image size and model architecture from
# train.yaml. The `export:` section below only contains values specific to the export step.
train_config: train.yaml

export:
  # Selected checkpoint to promote to the final ONNX.
  checkpoint: ../artifacts/checkpoints/best.pt

  # ONNX file consumed later by compile_final.yaml and board-side inference presets.
  output: ../artifacts/model.onnx

  # Opset validated against the TIDL 8.2 flow used by this repository.
  opset: 11

  # Maximum allowed absolute difference between PyTorch and ONNX Runtime CPU outputs
  # during the export smoke test.
  tolerance: 0.01

  # Keep this false unless you intentionally want to skip the ONNX Runtime validation pass.
  skip_ort_check: false
