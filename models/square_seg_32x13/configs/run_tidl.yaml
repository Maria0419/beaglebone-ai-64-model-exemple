# Board-package TIDL inference preset.
# Relative paths are resolved from this YAML file inside the deployed example package.
# The inference script reads its runtime settings from this YAML; the only CLI argument is --config.
run:
  # Use the TIDL execution provider on the board.
  provider: tidl

  # Promoted ONNX copied into the example package.
  onnx: ../artifacts/model.onnx

  # Example input image. Replace it with the image you want to test.
  image: ../test_images/img_0001_image.tif

  # Output mask path inside the example package.
  output: ../artifacts/tidl_mask.png

  # Folder containing the compiled TIDL artifacts.
  artifacts_folder: ../artifacts/tidl/model-artifacts/square_seg

  # Board runtime location for the TIDL shared libraries on the validated image.
  tidl_tools_path: /usr/lib

  # Threshold validated for the final TIDL-compiled model on the board.
  threshold: 0.99

  # Explicit resize target used before inference.
  height: 128
  width: 128
