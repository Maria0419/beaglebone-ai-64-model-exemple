# Base configuration shared by training and by YAMLs that reference this file with
# `train_config: train.yaml`.
#
# Edit the dataset paths before training on another host.
train_dir: /home/maria/Project/ia/models/data/data/train
test_dir: /home/maria/Project/ia/models/data/data/test

# Root output directory used by this example model.
# Training writes checkpoints, metrics, and sample masks here.
artifacts_dir: artifacts

# Input tensor size expected by the model and by the exported ONNX graph.
image_height: 128
image_width: 128

# Model architecture. Keep these aligned with the checkpoint you plan to export.
channels: 32
layers: 13
kernel_size: 3

# Optimization settings for src/train.py.
epochs: 8
batch_size: 192
eval_batch_size: 256
learning_rate: 0.001
min_learning_rate: 0.00001
weight_decay: 0.000001
max_grad_norm: 1.0
num_workers: 4
amp: true

# Validation threshold used for CPU-side mask binarization during training.
threshold: 0.5

# Threshold sweep evaluated during validation when comparing candidate checkpoints.
thresholds: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

# Loss weighting for the positive class and for BCE vs Dice.
pos_weight: 4.0
bce_loss_weight: 1.0
dice_loss_weight: 3.0

# Default number of images to use later during TIDL calibration.
calibration_frames: 128

# Board-side threshold measured for the final TIDL-compiled model.
tidl_threshold: 0.99
