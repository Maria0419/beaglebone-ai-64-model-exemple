# Base configuration shared by training and by YAMLs that reference this file with
# `train_config: train.yaml`.
#
# Edit the dataset paths before training on another host.
train_dir: /home/maria/Project/ia/models/data/data/train
test_dir: /home/maria/Project/ia/models/data/data/test

# Root output directory used by this example model.
# Training writes model.pt and metrics here.
artifacts_dir: artifacts

# Input tensor size expected by the model and by the exported ONNX graph.
image_height: 128
image_width: 128

# Model selection. Change `name` when the example is extended with another builder,
# and edit only the parameters used by that selected model.
model:
  name: square_seg
  params:
    channels: 32
    layers: 13
    kernel_size: 3

# Optimization settings for src/train.py.
epochs: 8
batch_size: 192
eval_batch_size: 256
learning_rate: 0.001
max_grad_norm: 1.0
num_workers: 4
augment: false

# Dice remains the base loss. BCEWithLogitsLoss is added on top to stabilize
# sparse foreground training; pos_weight emphasizes positive pixels.
bce_loss_weight: 1.0
pos_weight: 4.0


# Stop training after this many epochs without IoU improvement on the validation set.
early_stopping_patience: 5

# Default number of images to use later during TIDL calibration.
calibration_frames: 128

# Board-side threshold measured for the final TIDL-compiled model.
tidl_threshold: 0.99
