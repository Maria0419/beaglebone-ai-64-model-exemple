# Reproducible training configuration for the selected 32-channel, 13-layer model.
# Train it with:
#   python3 src/train.py --config configs/train_32x13.yaml
# Edit the dataset paths before training on another host.
train_dir: /home/maria/Project/ia/models/data/data/train
test_dir: /home/maria/Project/ia/models/data/data/test

# Candidate-specific output root. This run writes best.pt, last.pt, metrics.json,
# threshold sweep results, and sample predictions under artifacts/candidates/32x13/.
artifacts_dir: artifacts/candidates/32x13

# Architecture used by the final deployed candidate.
image_height: 128
image_width: 128
channels: 32
layers: 13
kernel_size: 3

# Training schedule used for the selected candidate run.
epochs: 14
batch_size: 192
eval_batch_size: 256
learning_rate: 0.001
min_learning_rate: 0.00001
weight_decay: 0.000001
max_grad_norm: 1.0
num_workers: 4
amp: true

# Validation settings for CPU-side checkpoint selection.
threshold: 0.5
thresholds: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

# Loss weighting used during the selected run.
pos_weight: 4.0
bce_loss_weight: 1.0
dice_loss_weight: 3.0

# Number of training images later reused for TIDL calibration.
calibration_frames: 128
