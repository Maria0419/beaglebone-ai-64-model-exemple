# Reproducible training configuration for the selected 32-channel, 13-layer model.
# Train it with:
#   python3 src/train.py --config configs/train_32x13.yaml
# Edit the dataset paths before training on another host.
train_dir: /home/maria/Project/ia/models/data/data/train
test_dir: /home/maria/Project/ia/models/data/data/test

# Candidate-specific output root. This run writes model.pt and metrics.json
# under artifacts/candidates/32x13/.
artifacts_dir: artifacts/candidates/32x13

image_height: 128
image_width: 128

# Model selection for the final deployed candidate.
model:
  name: square_seg
  params:
    channels: 32
    layers: 13
    kernel_size: 3

# Training schedule used for the selected candidate run.
epochs: 14
batch_size: 192
eval_batch_size: 256
learning_rate: 0.001
max_grad_norm: 1.0
num_workers: 4
augment: false

# Dice remains the base loss. BCEWithLogitsLoss is added on top to stabilize
# sparse foreground training; pos_weight emphasizes positive pixels.
bce_loss_weight: 1.0
pos_weight: 4.0


# Stop training after this many epochs without IoU improvement on the validation set.
early_stopping_patience: 5

# Number of training images later reused for TIDL calibration.
calibration_frames: 128
